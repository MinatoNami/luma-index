<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="LumaIndex">
  <title>LumaIndex</title>
  <defs>
    <linearGradient id="luma-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5F5EE0"/>
      <stop offset="1" stop-color="#3B3AAF"/>
    </linearGradient>
    <!-- Warm at the top edge: the "luma", as light falling on a page rather
         than a separate glowing object. A discrete light source read as a head
         above two shoulders, which is not what this is. -->
    <linearGradient id="luma-page" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset="0.55" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9E7FB"/>
    </linearGradient>
  </defs>

  <!-- Squircle-ish radius, so it sits comfortably beside platform icons. -->
  <rect width="64" height="64" rx="15" fill="url(#luma-tile)"/>

  <!-- A page. Solid fill, not a stroke: a 1px outline vanishes at 16px. -->
  <rect x="15" y="11" width="34" height="42" rx="4.5" fill="url(#luma-page)"/>

  <!-- Spine, which is what stops the page reading as a plain rounded square. -->
  <path d="M15 15.5A4.5 4.5 0 0 1 19.5 11h2.5v42h-2.5A4.5 4.5 0 0 1 15 48.5Z"
        fill="#2E2D96"/>

  <!-- Bookmark: the "index". Also the one warm note, so the mark is
       identifiable in a strip of tabs even at 16px. -->
  <path d="M33 11h9v21.5a1 1 0 0 1-1.6.8L37.5 31l-2.9 2.3a1 1 0 0 1-1.6-.8Z"
        fill="#F5A623"/>
</svg>
