name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lumaindex
          POSTGRES_USER: lumaindex
          POSTGRES_PASSWORD: ci-password
        options: >-
          --health-cmd "pg_isready -U lumaindex"
          --health-interval 10s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      DJANGO_SECRET_KEY: ci-secret-key-long-enough-for-the-deploy-check-0123456789
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_HOST: localhost
      POSTGRES_DB: lumaindex
      POSTGRES_USER: lumaindex
      POSTGRES_PASSWORD: ci-password
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Django deployment checks
        run: python manage.py check --deploy --fail-level ERROR
      - name: Migrations are complete
        # Fails if a model changed without a matching migration — the usual way
        # a deploy dies at the entrypoint instead of in review.
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -S warning deploy/deploy.sh deploy/bootstrap.sh backend/entrypoint.sh

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          set -a; . ./.env.example; set +a
          docker compose -f compose.yaml config >/dev/null
          docker compose -f compose.yaml -f compose.dev.yaml config >/dev/null
