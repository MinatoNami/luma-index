# Local development overrides:
#
#   docker compose -f compose.yaml -f compose.dev.yaml up --build
#
# Serves over plain HTTP on http://localhost:8080 with hot reload, so the
# cookie Secure flags are off — that combination is for localhost only.

services:
  backend:
    build:
      context: ./backend
    environment:
      DJANGO_DEBUG: "True"
      DJANGO_SESSION_COOKIE_SECURE: "False"
      DJANGO_CSRF_COOKIE_SECURE: "False"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost:8080"
      LUMA_REGISTRATION_ENABLED: "True"
      # Only Caddy sits in front of Django locally; there is no tailscale serve.
      LUMA_NUM_PROXIES: "1"
      LUMA_LOG_CLIENT_IP: "True"
    volumes:
      - ./backend:/app
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

  frontend:
    build:
      context: ./frontend
      target: build
    environment:
      NUXT_API_INTERNAL_BASE: http://backend:8000
      NUXT_PUBLIC_API_BASE: /api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.nuxt
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]
