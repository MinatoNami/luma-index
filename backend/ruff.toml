line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "I", "UP", "B", "DJ", "S"]
ignore = [
    "S101",  # assert — used throughout the test suite
]

[lint.per-file-ignores]
# Migrations are generated; their import order is Django's business.
"*/migrations/*" = ["E501", "I001"]
# S105 flags every literal used as a test password or a redaction fixture.
"**/test_*.py" = ["S105", "S106"]
"**/tests_*.py" = ["S105", "S106"]
