# LumaIndex — production compose file.
#
#   docker compose up -d --build
#
# Nothing here is published beyond 127.0.0.1. Access reaches the host through
# `tailscale serve`, which terminates TLS for the MagicDNS name and forwards to
# Caddy on localhost. See deploy/bootstrap.sh.

name: lumaindex

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lumaindex}
      POSTGRES_USER: ${POSTGRES_USER:-lumaindex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Deterministic initdb settings; changing these later needs a dump/restore.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lumaindex} -d ${POSTGRES_DB:-lumaindex}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Not published. Reachable only from the compose network.
    expose:
      - "5432"

  backend:
    build:
      context: ./backend
    image: lumaindex-backend:${LUMA_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment: &backend-env
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
      DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-True}
      DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-True}
      DJANGO_SESSION_COOKIE_AGE: ${DJANGO_SESSION_COOKIE_AGE:-1209600}
      LUMA_PUBLIC_ORIGIN: ${LUMA_PUBLIC_ORIGIN:-}
      LUMA_REGISTRATION_ENABLED: ${LUMA_REGISTRATION_ENABLED:-False}
      LUMA_NUM_PROXIES: ${LUMA_NUM_PROXIES:-2}
      LUMA_LOG_CLIENT_IP: ${LUMA_LOG_CLIENT_IP:-False}
      LUMA_THROTTLE_AUTH: ${LUMA_THROTTLE_AUTH:-10/min}
      LUMA_THROTTLE_LOGIN_EMAIL: ${LUMA_THROTTLE_LOGIN_EMAIL:-5/min}
      POSTGRES_DB: ${POSTGRES_DB:-lumaindex}
      POSTGRES_USER: ${POSTGRES_USER:-lumaindex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      LUMA_EMAIL_BACKEND: ${LUMA_EMAIL_BACKEND:-console}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      # Left empty rather than defaulted to True: the app picks TLS or SSL from
      # the port, and forcing TLS on here made port 465 — implicit TLS — refuse
      # to boot, complaining about a variable the operator never set.
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-}
      EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-10}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-lumaindex@localhost}
      SERVER_EMAIL: ${SERVER_EMAIL:-}
      LUMA_LIBRARY_DIR: /data/library
      LUMA_THUMBNAIL_DIR: /data/thumbnails
      LUMA_UPLOAD_STAGING_DIR: /data/staging
      LUMA_MAX_UPLOAD_BYTES: ${LUMA_MAX_UPLOAD_BYTES:-2147483648}
      LUMA_MIN_FREE_DISK_BYTES: ${LUMA_MIN_FREE_DISK_BYTES:-2147483648}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
    volumes:
      - library:/data/library
      - thumbnails:/data/thumbnails
      - staging:/data/staging
    expose:
      - "8000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # Upload ingestion runs here rather than inside a request: extracting a ZIP
  # of a few hundred books, probing each one, and rendering thumbnails takes
  # minutes. A loop claiming work with a Postgres advisory lock keeps Redis and
  # Celery out of the stack until an async workload justifies them (PRD §36).
  worker:
    build:
      context: ./backend
    image: lumaindex-backend:${LUMA_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment: *backend-env
    entrypoint: ["python", "manage.py", "run_ingest_worker"]
    volumes:
      - library:/data/library
      - thumbnails:/data/thumbnails
      - staging:/data/staging
    # The image's healthcheck curls the API, which this container does not
    # serve. Watch the loop's heartbeat instead, so a worker wedged on a hung
    # call is restarted rather than passing because the process still exists.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import os,sys,time; p='/tmp/lumaindex-ingest-worker.heartbeat'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 180 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # SIGTERM lets it finish the connection in flight instead of leaving a
    # SyncRun stuck in 'running'.
    stop_grace_period: 60s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  frontend:
    build:
      context: ./frontend
    image: lumaindex-frontend:${LUMA_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NUXT_API_INTERNAL_BASE: http://backend:8000
      NUXT_PUBLIC_API_BASE: /api
    expose:
      - "3000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      # 127.0.0.1 on purpose: `tailscale serve` is the only thing that reaches
      # this. Changing it to 0.0.0.0 exposes the app to every network the host
      # is on, including the public internet if it has a routable address.
      - "${LUMA_BIND_ADDRESS:-127.0.0.1}:${CADDY_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/api/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  postgres-data:
  # Canonical, irreplaceable: back this up.
  library:
  # Regenerable from library/.
  thumbnails:
  # Transient upload scratch.
  staging:
  caddy-data:
  caddy-config:
